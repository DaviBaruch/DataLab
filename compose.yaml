# ============================================================
# DataLab — Docker Compose (Fase 3: orquestração)
# ------------------------------------------------------------
# Serviços adicionados progressivamente conforme o roadmap:
#   Fase 3: postgres
#   Fase 4: etl (build da imagem local)
#   Fase 5: dashboard (Streamlit)
#
# Uso (PowerShell):
#   docker compose up -d            # inicia os serviços
#   docker compose ps               # estados dos containers
#   docker compose down             # encerra os serviços
#   docker compose logs -f          # acompanha os logs
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: datalab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # Persistência dos dados do banco
      - postgres_data:/var/lib/postgresql/data
      # Scripts SQL executados na primeira inicialização (Fase 4)
      - ./database/init:/docker-entrypoint-initdb.d:ro

